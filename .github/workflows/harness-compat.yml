# Does this plugin still work on the harness people actually run?
#
# One question per cell, four stages per cell:
#
#   types      both typechecks against that train's published .d.ts
#   tests      the plugin's own tests against that train's packages
#   admission  the peer ranges admit the version under BOTH semver rules — the
#              prerelease-inclusive one dsh >= 0.1.7 applies at install and at
#              boot (it refuses or silently skips a plugin that fails it), and
#              the default one npm and pnpm apply
#   smoke      scripts/smoke-boot.mjs: the packed plugin installs through the
#              official `dsh plugin add`, activates, and is served by a real
#              `dsh --profile web`
#
# v0.1.1 passed types and tests on 0.1.7 and still could not display anything
# in the desktop app: admission refused it. That is why all four exist.
#
# Cells (scripts/harness-target.mjs resolves each one to an exact version):
#
#   pinned              the devDependencies pin          gates PRs and releases
#   floor               0.1.1-rc.2                       gates PRs and releases
#   desktop             what the desktop app ships now,  on PRs (not required),
#                       read from both update feeds       daily, gates releases
#   latest|next|alpha   npm dist-tags                    daily
#   sweep               every published version from     weekly and in the release
#                       the lowest the peers admit —     gate, with the smoke on
#                       0.0.1-rc.1, all of them          every installable version
#   desktop-bytes       the same smoke on the desktop    daily, gates releases
#                       zip itself (macOS job below)
#
# A train nobody can install — not on npm yet, or its own @deepseek-ai/dsh
# fails with E404/ETARGET (0.0.1-rc.1 and rc.2 depend on a package that was
# never published) — is "incomplete": neutral, it neither opens nor closes an
# issue. A harness package this plugin compiles against that the train never
# published (dsh-client-ui-renderer before 0.1.0-rc.8) does not make it
# incomplete: that package keeps this repository's pin, for types, and the
# smoke decides whether the plugin runs there. Only npm saying "not there"
# makes a train incomplete; a registry that did not answer fails the cell, and
# `pinned` and `floor` are never incomplete. Peer admission still runs on an
# incomplete train: it reads no package, and a version the ranges refuse is
# drift whether or not npm has it yet. Types and tests run there too when every
# package compiled against was published on it (`compiles`).
#
# Scheduled and dispatched runs report: a failing cell opens or comments on
# the `upstream-drift` issue "Harness compatibility broken against @<cell>",
# and a cell whose every stage passes comments on that issue and closes it.
# A stage cancelled by its time limit counts as failed. The `unreported` job
# files any cell (or the plan) that failed before its own verdict could — a
# failed checkout, a job that ran out of time — so no scheduled failure ends
# silently.
name: Harness compatibility

on:
  schedule:
    - cron: '17 5 * * *'   # daily: desktop, latest, next, alpha, desktop-bytes
    - cron: '43 6 * * 1'   # weekly: the full sweep, desktop-bytes
  workflow_dispatch:
    inputs:
      cells:
        description: 'Comma-separated: pinned, floor, desktop, latest, next, alpha, sweep, or exact versions'
        default: 'desktop,latest,next,alpha'
        type: string
      smoke:
        description: 'Boot smoke for sweep rows (the weekly run uses all)'
        default: heads
        type: choice
        options: [heads, all, none]
      desktop-bytes:
        description: 'Also smoke the desktop zip on macOS'
        default: true
        type: boolean
      report:
        description: 'Open, comment on and close upstream-drift issues'
        default: true
        type: boolean
  workflow_call:
    inputs:
      cells:
        type: string
        default: 'pinned,floor'
      smoke:
        type: string
        default: heads
      desktop-bytes:
        type: boolean
        default: false
      report:
        type: boolean
        default: false
      ref:
        description: 'Ref to test; the caller''s ref when empty'
        type: string
        default: ''
      tarball-artifact:
        description: 'An artifact of this run holding dsh-viewer.tgz to smoke instead of packing the checkout — the release gate smokes the exact file it releases'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm

      # The resolver needs semver; the lockfile provides it.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10

      - name: Plan the cells
        id: plan
        timeout-minutes: 10
        env:
          CELLS: ${{ inputs.cells || (github.event.schedule == '43 6 * * 1' && 'sweep') || 'desktop,latest,next,alpha' }}
          # The weekly sweep boots every installable version; see the header.
          SMOKE: ${{ inputs.smoke || (github.event.schedule == '43 6 * * 1' && 'all') || 'heads' }}
        run: node scripts/harness-target.mjs --plan "$CELLS" --smoke "$SMOKE"

  against:
    needs: plan
    name: harness@${{ matrix.cell }}
    runs-on: ubuntu-latest
    # A backstop. Every long step has its own limit below, so a hang fails
    # that stage and the verdict still runs; `unreported` covers the rest.
    timeout-minutes: 150
    # Only the verdict writes issues, and only when reporting. A caller must
    # grant this too: a called workflow cannot hold more than its caller gives.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        id: node
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: deps
        timeout-minutes: 10

      # Exit 3 is an incomplete train: the step passes, `incomplete` is set,
      # and every later stage but admission stands down — types and tests
      # still run when `compiles` says the train has every package they need.
      # Besides the registry reads, this installs @deepseek-ai/dsh on its own
      # in a dry run (legacy peer mode, seconds; npm may take minutes to fail).
      - name: Resolve ${{ matrix.cell }}
        id: target
        timeout-minutes: 20
        run: |
          set +e
          node scripts/harness-target.mjs "$CELL" --repoint
          status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          exit "$status"

      # The peer graph gets 5 minutes, the train's own graph 15, a bare
      # install of @deepseek-ai/dsh 15 (scripts/harness-lib.mjs).
      - name: Install that train
        id: install
        if: steps.target.outputs.incomplete != 'true' || steps.target.outputs.compiles == 'true'
        timeout-minutes: 40
        env:
          TARGET: ${{ matrix.cell == 'pinned' && 'pinned' || steps.target.outputs.version }}
        run: |
          set +e
          node scripts/harness-target.mjs "$TARGET" --install
          status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          exit "$status"

      - name: Typecheck both halves
        id: types
        if: (steps.target.outputs.incomplete != 'true' || steps.target.outputs.compiles == 'true') && steps.install.outcome == 'success' && steps.install.outputs.incomplete != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        id: tests
        if: (steps.target.outputs.incomplete != 'true' || steps.target.outputs.compiles == 'true') && steps.install.outcome == 'success' && steps.install.outputs.incomplete != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: npm test

      # Needs only the resolved version, so it runs whatever the install did.
      - name: Peer admission
        id: admission
        if: ${{ !cancelled() && steps.target.outputs.version != '' }}
        timeout-minutes: 5
        continue-on-error: true
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: node scripts/harness-target.mjs "$VERSION" --admits

      - name: Fetch the tarball under test
        id: tarball
        if: inputs.tarball-artifact != '' && matrix.smoke && steps.target.outputs.incomplete != 'true' && steps.install.outputs.incomplete != 'true'
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tarball-artifact }}
          path: ${{ runner.temp }}/tarball

      # The harness install gets 2 minutes on the peer graph, then legacy peer
      # mode; every other command 10 minutes; the boot 4 (scripts/smoke-boot.mjs).
      - name: Boot smoke
        id: smoke
        if: matrix.smoke && steps.target.outputs.incomplete != 'true' && steps.install.outputs.incomplete != 'true'
        timeout-minutes: 45
        continue-on-error: true
        env:
          VERSION: ${{ steps.target.outputs.version }}
          SMOKE_RESULT: ${{ runner.temp }}/smoke.jsonl
          TARBALL: ${{ inputs.tarball-artifact != '' && format('{0}/tarball/dsh-viewer.tgz', runner.temp) || '' }}
        run: |
          # Never pack a repointed manifest: the smoke installs what a user gets.
          git checkout -- package.json package-lock.json
          node scripts/smoke-boot.mjs --dsh "$VERSION" ${TARBALL:+--tarball "$TARBALL"}

      - if: always() && steps.target.outputs.version != ''
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        # Evidence for release notes, not a stage: it must not fail the cell
        # after its verdict has been decided.
        continue-on-error: true
        with:
          name: harness-${{ matrix.cell }}
          path: ${{ runner.temp }}/smoke.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Verdict
        if: always()
        uses: actions/github-script@v7
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.target.outputs.version }}
          INCOMPLETE: ${{ steps.target.outputs.incomplete == 'true' || steps.install.outputs.incomplete == 'true' }}
          EXPECTED: ${{ matrix.smoke && 'setup,types,tests,admission,smoke' || 'setup,types,tests,admission' }}
          REPORT: ${{ github.event_name == 'schedule' || inputs.report }}
          JOB_STATUS: ${{ job.status }}
          STAGE_setup: ${{ (steps.node.outcome == 'success' && steps.deps.outcome) || steps.node.outcome }}
          STAGE_resolve: ${{ steps.target.outcome }}
          STAGE_install: ${{ steps.install.outcome }}
          STAGE_types: ${{ steps.types.outcome }}
          STAGE_tests: ${{ steps.tests.outcome }}
          STAGE_admission: ${{ steps.admission.outcome }}
          STAGE_tarball: ${{ steps.tarball.outcome }}
          STAGE_smoke: ${{ steps.smoke.outcome }}
        with:
          script: await require('./scripts/harness-verdict.cjs')({ github, context, core })

  # The same smoke on the desktop app's own bytes: its Electron Node, the exact
  # runtime package set inside app.asar and its bundled pnpm. mac-arm64 is the
  # only mac feed that exists, and macos-latest is arm64.
  #
  # Not covered here or anywhere in CI: the Electron renderer, the preload
  # bridge and native drag-and-drop. Those need the GUI.
  desktop-bytes:
    if: github.event_name == 'schedule' || inputs.desktop-bytes
    name: harness@desktop-bytes
    runs-on: macos-latest
    timeout-minutes: 100
    permissions:
      contents: read
      issues: write
    env:
      CELL: desktop-bytes
    steps:
      - uses: actions/checkout@v4
        id: checkout
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        id: node
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: deps
        timeout-minutes: 10

      - name: Read the mac-arm64 feed
        id: feed
        timeout-minutes: 5
        run: node scripts/harness-target.mjs --feed mac-arm64

      - uses: actions/cache@v4
        id: app
        timeout-minutes: 10
        with:
          path: ~/dsh-desktop
          # hashFiles() only sees the workspace; the feed's digest names the build exactly.
          key: dsh-desktop-mac-arm64-${{ steps.feed.outputs.version }}-${{ steps.feed.outputs.sha512 }}

      - name: Download and verify the shipped zip
        id: download
        if: steps.app.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          URL: ${{ steps.feed.outputs.path }}
          SHA512: ${{ steps.feed.outputs.sha512 }}
        run: |
          curl -fL --retry 3 --retry-delay 10 "$URL" -o "$RUNNER_TEMP/app.zip"
          actual="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/app.zip" | base64)"
          if [ "$actual" != "$SHA512" ]; then echo "::error::sha512 mismatch: the zip is not the build the feed announces"; exit 1; fi
          mkdir -p ~/dsh-desktop
          ditto -x -k "$RUNNER_TEMP/app.zip" ~/dsh-desktop
          rm "$RUNNER_TEMP/app.zip"

      - name: Cross-check the bundled runtime against the feed
        id: runtime
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.feed.outputs.version }}
        run: |
          APP="$(find ~/dsh-desktop -maxdepth 2 -name '*.app' -print -quit)"
          EXE="$APP/Contents/MacOS/$(defaults read "$APP/Contents/Info" CFBundleExecutable)"
          RES="$APP/Contents/Resources"
          {
            echo "exe=$EXE"
            echo "harness=$RES/app.asar/dsh"
            echo "pnpm=$RES/runtime/pnpm/bin/pnpm.mjs"
          } >> "$GITHUB_OUTPUT"
          # desktop-runtime.json is what the app reports as its bundled dsh.
          ELECTRON_RUN_AS_NODE=1 "$EXE" -e '
            const [dir, feed] = process.argv.slice(1)
            const r = JSON.parse(require("fs").readFileSync(dir + "/desktop-runtime.json", "utf8"))
            const dsh = JSON.parse(require("fs").readFileSync(dir + "/node_modules/@deepseek-ai/dsh/package.json", "utf8")).version
            console.log(JSON.stringify({ feed, release: r.release, dsh }))
            if (r.release.version !== feed || dsh !== feed) { console.error("::error::the app bundles " + dsh + " (" + r.release.version + ") but its feed announces " + feed); process.exit(1) }
          ' "$RES/app.asar/dsh" "$VERSION"

      - name: Fetch the tarball under test
        id: tarball
        if: inputs.tarball-artifact != ''
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tarball-artifact }}
          path: ${{ runner.temp }}/tarball

      - name: Boot smoke on the desktop runtime
        id: smoke
        timeout-minutes: 30
        continue-on-error: true
        env:
          EXE: ${{ steps.runtime.outputs.exe }}
          HARNESS: ${{ steps.runtime.outputs.harness }}
          PNPM_MJS: ${{ steps.runtime.outputs.pnpm }}
          SMOKE_RESULT: ${{ runner.temp }}/smoke.jsonl
          TARBALL: ${{ inputs.tarball-artifact != '' && format('{0}/tarball/dsh-viewer.tgz', runner.temp) || '' }}
        run: |
          # `dsh plugin` runs whatever pnpm is on PATH: make that the app's own.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nELECTRON_RUN_AS_NODE=1 exec "%s" "%s" "$@"\n' "$EXE" "$PNPM_MJS" > "$RUNNER_TEMP/bin/pnpm"
          chmod +x "$RUNNER_TEMP/bin/pnpm"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          ELECTRON_RUN_AS_NODE=1 "$EXE" scripts/smoke-boot.mjs --harness-dir "$HARNESS" ${TARBALL:+--tarball "$TARBALL"}

      - if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: harness-desktop-bytes
          path: ${{ runner.temp }}/smoke.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Verdict
        if: always()
        uses: actions/github-script@v7
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.feed.outputs.version }}
          INCOMPLETE: 'false'
          EXPECTED: setup,feed,runtime,smoke
          REPORT: ${{ github.event_name == 'schedule' || inputs.report }}
          JOB_STATUS: ${{ job.status }}
          STAGE_setup: ${{ (steps.node.outcome == 'success' && steps.deps.outcome) || steps.node.outcome }}
          STAGE_feed: ${{ steps.feed.outcome }}
          STAGE_download: ${{ steps.download.outcome }}
          STAGE_runtime: ${{ steps.runtime.outcome }}
          STAGE_tarball: ${{ steps.tarball.outcome }}
          STAGE_smoke: ${{ steps.smoke.outcome }}
        with:
          script: await require('./scripts/harness-verdict.cjs')({ github, context, core })

  # Any job above that failed or ran out of time before its verdict could
  # report — or a plan that never produced cells — is filed here, in the same
  # issue that job's cell keeps. Reads the run's jobs, hence `actions: read`;
  # a caller must grant it like `issues: write`.
  unreported:
    needs: [plan, against, desktop-bytes]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: File what no verdict reported
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/harness-verdict.cjs').unreported({ github, context, core })
