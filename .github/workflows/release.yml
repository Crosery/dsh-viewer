# Cut a release from a tag.
#
# The attached tarball is what lets users install without the profile's
# `allowBuilds` build-approval step, so it is built by CI rather than from
# whatever happened to be on a laptop.
#
# One tarball, packed once: `pack` verifies the tag's tree and packs it,
# `gate` boot-smokes exactly that file, and `release` attaches (and, opted
# in, publishes) the same bytes after checking their sha256. The release
# notes say which tarball was smoked, and refuse to say it unless every smoke
# recorded that digest.
#
# Nothing is attached or published until `gate` passes: the tarball must
# install, activate and be served on the pinned train, on the floor, on the
# version the desktop app ships today (as the npm Web app and as the desktop
# zip itself) and on every published harness version that installs at all,
# and the tag's tree must typecheck, test and be admitted on every published
# harness version the sweep finds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true
        type: string
      publish:
        description: 'Publish the gate tarball to npm through Trusted Publishing'
        default: true
        type: boolean
  # Called by `.github/workflows/upstream-follow.yml` once it has recorded a
  # train and tagged the commit. A tag pushed with GITHUB_TOKEN starts no run of
  # its own, so the gate is invoked directly; it is the same gate either way.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build, gate and release'
        required: true
        type: string
      publish:
        description: 'Publish the gate tarball to npm through Trusted Publishing'
        default: true
        type: boolean

# npm Trusted Publishing exchanges this run's GitHub OIDC identity for a
# short-lived publish credential; no long-lived NPM_TOKEN is needed.
permissions:
  id-token: write
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Refuse a tag that disagrees with package.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json $PKG"
            exit 1
          fi
          echo "tag matches package.json: $TAG"

      # check:dist compares the committed lib/ with a scratch build, so it has
      # to run before `npm run build` rewrites lib/ in place — after that, a
      # stale commit compares equal. The build then must change nothing.
      - name: Verify the tree the tarball is packed from
        run: |
          npm run typecheck
          npm test
          npm run check
          npm run check:dist
          npm run build
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::npm run build changed lib/: the tag's committed dist is not what its src builds"
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          npm pack --ignore-scripts --silent >/dev/null
          # A version-free asset name so `releases/latest/download/dsh-viewer.tgz`
          # keeps resolving after the next release. `latest/download/` resolves
          # `latest` at request time but takes the filename literally.
          mv -- "$(ls -- *.tgz)" dsh-viewer.tgz
          ls -la dsh-viewer.tgz
          echo "sha256=$(sha256sum dsh-viewer.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dsh-viewer.tgz
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: pack
    # `issues: write` and `actions: read` are declared by the called workflow;
    # `report` is off, so a release run never files issues.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/harness-compat.yml
    with:
      cells: pinned,floor,desktop,sweep
      smoke: all
      desktop-bytes: true
      ref: ${{ inputs.tag || github.ref }}
      tarball-artifact: release-tarball

  release:
    needs: [pack, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Fetch the tarball the gate smoked
        uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - name: Check it is the tarball that was packed
        env:
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          mv -- "$RUNNER_TEMP/release/dsh-viewer.tgz" dsh-viewer.tgz
          echo "$SHA256  dsh-viewer.tgz" | sha256sum -c -

      # The exact harness versions the gate verified, prepended to the notes of
      # a new release and written to this run's summary either way.
      - name: Collect what the gate verified
        uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: ${{ runner.temp }}/verified

      - name: Compatibility note
        env:
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          node scripts/release-notes.mjs "$RUNNER_TEMP/verified" --sha256 "$SHA256" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dsh-viewer.tgz --clobber
          else
            gh release create "$TAG" dsh-viewer.tgz --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
          fi

      # Bind npm Trusted Publishers to Crosery/dsh-viewer and each caller:
      # release.yml for direct runs, upstream-follow.yml for reusable calls.
      # npm checks the caller workflow name; both must allow direct publishing.
      # The package is published from this exact tarball after the compatibility
      # gate; OIDC supplies a short-lived credential and provenance attestation.
      # `publish=false` is the bootstrap mode: pack, gate and the GitHub
      # release still complete, while npm remains untouched so the tarball can
      # be downloaded for the one-time local first publish.
      - name: Publish to npm
        if: ${{ inputs.publish || (github.event_name == 'push' && !contains(toJSON(inputs), '"publish"')) }}
        run: |
          npm --version | grep -q '^1[1-9]\.' || npm i -g npm@latest
          npm publish dsh-viewer.tgz --access public --provenance
