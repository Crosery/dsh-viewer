# Cut a release from a tag.
#
# The attached tarball is what lets users install without the profile's
# `allowBuilds` build-approval step, so it is built by CI rather than from
# whatever happened to be on a laptop.
#
# Nothing is attached or published until `gate` passes: the tag's own tree
# must install, activate and be served on its pinned train, on the floor, on
# the version the desktop app ships today (as the npm Web app and as the
# desktop zip itself) and on the newest version of every tuple, and must
# typecheck, test and be admitted on every published harness version the
# sweep finds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  gate:
    # `issues: write` is declared by the called workflow; `report` is off, so
    # a release run never files issues.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/harness-compat.yml
    with:
      cells: pinned,floor,desktop,sweep
      smoke: heads
      desktop-bytes: true
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: gate
    runs-on: ubuntu-latest
    # The token lives here, not on the publish step below: GitHub evaluates a
    # step's `if` before applying that step's own `env`, so a guard reading a
    # same-step value sees nothing, evaluates truthy, and runs `npm publish`
    # with no credentials. Job-level env is what the guard can actually see.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify before publishing anything
        run: |
          npm run typecheck
          npm test
          npm run check
          npm run build
          npm run check:dist

      - name: Refuse a tag that disagrees with package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi
          echo "tag matches package.json: $TAG"

      - name: Pack
        id: pack
        run: |
          npm pack --silent >/dev/null
          # A version-free asset name so `releases/latest/download/dsh-viewer.tgz`
          # keeps resolving after the next release. `latest/download/` resolves
          # `latest` at request time but takes the filename literally.
          cp -- "$(ls -- *.tgz)" dsh-viewer.tgz
          ls -la dsh-viewer.tgz

      # The exact harness versions the gate verified, prepended to the notes of
      # a new release and written to this run's summary either way.
      - name: Collect what the gate verified
        uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: ${{ runner.temp }}/verified

      - name: Compatibility note
        run: |
          node - "$RUNNER_TEMP/verified" > "$RUNNER_TEMP/notes.md" <<'JS'
          const { existsSync, readdirSync, readFileSync } = require('node:fs')
          const dir = process.argv[2]
          const rows = (existsSync(dir) ? readdirSync(dir) : []).sort().flatMap((cell) => {
            const file = `${dir}/${cell}/smoke.jsonl`
            if (!existsSync(file)) return []
            return readFileSync(file, 'utf8').trim().split('\n').filter(Boolean).map((line) => [cell.replace(/^harness-/, ''), JSON.parse(line)])
          })
          console.log('### Verified harness versions\n')
          console.log('Boot smoke of this release\'s tarball: installed with `dsh plugin add` (no exemption), activated and served.\n')
          console.log('| cell | dsh | smoke |\n| --- | --- | --- |')
          for (const [cell, r] of rows) console.log(`| ${cell} | ${r.dsh ?? '?'} | ${r.outcome} |`)
          console.log('\nEvery published harness version the gate swept either passed typecheck, tests and peer admission or is published incomplete upstream; the gate run lists each one.')
          JS
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dsh-viewer.tgz --clobber
          else
            gh release create "$TAG" dsh-viewer.tgz --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
          fi

      # Opt-in, and off by default.
      #
      # A configured token is not evidence that this package can be published:
      # the first release run with a token present got `404 Not Found - PUT
      # https://registry.npmjs.org/@crosery%2fdsh-viewer`, which is how npm
      # reports an unauthorized scoped publish. Attempting it on every tag turns
      # each release red for a reason that is not about the release.
      #
      # Turn it on by setting the repository variable NPM_PUBLISH=true (Settings
      # → Secrets and variables → Actions → Variables) once the npm scope exists
      # and NPM_TOKEN can publish to it. With the variable unset and a token
      # missing, the step is skipped rather than failing.
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: npm publish --access public
