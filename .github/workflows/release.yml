# Cut a release from a tag.
#
# The attached tarball is what lets users install without the profile's
# `allowBuilds` build-approval step, so it is built by CI rather than from
# whatever happened to be on a laptop.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The token lives here, not on the publish step below: GitHub evaluates a
    # step's `if` before applying that step's own `env`, so a guard reading a
    # same-step value sees nothing, evaluates truthy, and runs `npm publish`
    # with no credentials. Job-level env is what the guard can actually see.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify before publishing anything
        run: |
          npm run typecheck
          npm test
          npm run check
          npm run build
          npm run check:dist

      - name: Refuse a tag that disagrees with package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi
          echo "tag matches package.json: $TAG"

      - name: Pack
        id: pack
        run: |
          npm pack --silent >/dev/null
          # A version-free asset name so `releases/latest/download/dsh-viewer.tgz`
          # keeps resolving after the next release. `latest/download/` resolves
          # `latest` at request time but takes the filename literally.
          cp "$(ls *.tgz)" dsh-viewer.tgz
          ls -la dsh-viewer.tgz

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" dsh-viewer.tgz --clobber \
            || gh release create "$TAG" dsh-viewer.tgz --generate-notes --title "$TAG"

      # Opt-in, and off by default.
      #
      # A configured token is not evidence that this package can be published:
      # the first release run with a token present got `404 Not Found - PUT
      # https://registry.npmjs.org/@crosery%2fdsh-viewer`, which is how npm
      # reports an unauthorized scoped publish. Attempting it on every tag turns
      # each release red for a reason that is not about the release.
      #
      # Turn it on by setting the repository variable NPM_PUBLISH=true (Settings
      # → Secrets and variables → Actions → Variables) once the npm scope exists
      # and NPM_TOKEN can publish to it. With the variable unset and a token
      # missing, the step is skipped rather than failing.
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: npm publish --access public
